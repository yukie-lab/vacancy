# VACANCY 実行環境(Phase 0 実測環境を固定: conda base Python 3.13.13 / numpy 2.5.2)
# 再現手順: conda env create -f environment.yml && conda activate vacancy
# 依存追加は本ファイル経由でのみ行い、裁定ログに記録する(WAKE/EMBARK と同運用)。
name: vacancy
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.5
  - pytest=8
  # 外部取得は urllib + curl のみ(astropy/astroquery 不使用 — Phase 0 実測どおり)
  # 予約: matplotlib(図版, Phase 5)
